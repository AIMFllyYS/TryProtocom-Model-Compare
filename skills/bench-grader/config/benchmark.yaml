# 基准全局参数
name: Coding Bench
version: v1.0
frozen_date: null          # 正式开跑当天填写，例如 2026-10-08

runs_per_task: 1           # 默认首轮每模型每题/条件一次；全模型首轮完成或用户明确指定后才补至三次
pass_threshold: 60         # 单次运行题目总分 ≥ 60 视为“达标”，用于达标率和期望成本
low_confidence_na_ratio: 0.2   # 某次运行中 N/A（评测环境原因无法检查）项权重占比超过 20% 时标记“低可信”

# 同一题目对各维度的贡献权重：主要考察 1.0，次要考察 0.5（在各题 rubric.yaml 的 dims 字段里声明）

efficiency:
  cost:                    # 期望成功成本（美元）→ 分数，对数刻度线性插值
    best: 0.3              # ≤ 0.3 美元记 100 分
    worst: 30              # ≥ 30 美元记 0 分
  speed:                   # 期望达标用时（分钟）→ 分数
    best: 5                # ≤ 5 分钟记 100 分
    worst: 180             # ≥ 180 分钟记 0 分

composite:                 # 可选综合分。默认只报告质量总分 + 两个效率维度，不强行合并
  enabled: false
  quality_weight: 0.8
  cost_weight: 0.1
  speed_weight: 0.1

statistics:
  bootstrap_samples: 2000
  ci: 0.95                 # 置信区间重叠的名次记为并列

blinding:
  alias_prefix: R          # 人工评分时运行被重命名为 R01、R02……，隐藏模型名

# 无头浏览器评测
browser:
  headless: true
  gl: auto                 # auto：有显卡用显卡，否则退回 SwiftShader 软件渲染；gpu / swiftshader 强制指定
                           # 软件渲染会持续占满十几个 CPU 核、帧率只有 GPU 的 1/3~1/5，只在没有显卡的评测机上用

# 外部依赖路径（评测机上）
external:
  api_python: C:/Users/AIMFl/AppData/Roaming/uv/python/cpython-3.11.15-windows-x86_64-none/python.exe
  api_node: D:/projects/Model-Compare/My-BenchMark/workbench/.runtime/benchmark-api-runtime/node-v22.23.3-win-x64/node.exe
  minecraft_skill_dir: D:/projects/Model-Compare/My-BenchMark/skills/bench-grader/tasks/T02-minecraft-stopmotion/materials/skills/minecraft-stop-motion-director
  axe_core_js: null           # axe-core 的 axe.min.js 路径（npm i axe-core 后在 node_modules/axe-core/axe.min.js）
  log_roots:                  # 用时/成本日志搜索根目录；留空用默认位置
    claude_code: ~/.claude/projects
    codex: ~/.codex/sessions
    gemini_cli: ~/.gemini/tmp

# ---- v2.0：另起的题库与榜单（v1.0 冻结为“历史版”，不迁移、不重算）----
v2:
  version: v2.0-draft
  frozen_date: null
  tier0_cap: 40              # Tier0（可用性）不通过时，该次运行总分与各维度分的上限；不直接清零，便于看出“能跑但崩”和“根本没交付”的差别
  full_runs: 3               # 完整版：每个参赛者每道题必须测满的次数
  stability:                 # 稳定性（仅完整版，雷达轴，不进质量总分）
    availability_weight: 0.5 # 可用率 = Tier0 通过的运行占比
    consistency_weight: 0.5  # 一致性 = 100 − k × 各题运行分标准差的均值
    consistency_k: 2.0
  incident_kinds: [tier0, harness, interrupted, other]
  environment:               # 评测机固定：同一台机器、同一渲染器；帧率类指标只在同一渲染器下可比
    require_same_gl_renderer: true