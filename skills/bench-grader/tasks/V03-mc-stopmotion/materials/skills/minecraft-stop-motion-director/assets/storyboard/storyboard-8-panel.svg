  <text x="80" y="108" font-family="sans-serif" font-size="18">Project: ____________________   Theme: ____________________   Duration: __________</text>
  <g font-family="sans-serif" font-size="18" fill="#111" stroke="#222" stroke-width="2">
    <g transform="translate(80,150)"><rect width="330" height="250" fill="white"/><text x="12" y="278" stroke="none">01 / World</text></g>
    <g transform="translate(450,150)"><rect width="330" height="250" fill="white"/><text x="12" y="278" stroke="none">02 / Character</text></g>
    <g transform="translate(820,150)"><rect width="330" height="250" fill="white"/><text x="12" y="278" stroke="none">03 / Problem</text></g>
    <g transform="translate(1190,150)"><rect width="330" height="250" fill="white"/><text x="12" y="278" stroke="none">04 / Decision</text></g>
    <g transform="translate(80,650)"><rect width="330" height="250" fill="white"/><text x="12" y="278" stroke="none">05 / Escalation</text></g>
    <g transform="translate(450,650)"><rect width="330" height="250" fill="white"/><text x="12" y="278" stroke="none">06 / Turn</text></g>
