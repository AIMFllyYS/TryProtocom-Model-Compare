id: B3
name: 作业队列 / 调度（优先级、延迟、租约、重试、死信）
short: 实现带租约的作业队列；考察取出顺序、租约过期与重试退避的时间语义、并发下不重复投递、崩溃后至少一次投递
extends: [backend]
deliverable_dir: job-queue
dims: {be: 1.0, eng: 0.5, agent: 0.4}
condition: 无人值守；评测机有 Node 22 与 Python 3.11；评测用 X-Bench-Now 请求头控制时间，并在负载下 kill -9 服务再重启
materials: []
time_limit_min: 90
probes:
  - type: files
    opts:
      required: [DECISIONS.md]
  - type: api
    opts:
      tests: [hidden/test_queue.py]
      support: [../_common/hidden/bt.py]
      chaos_test: hidden/test_chaos.py
      categories: [func, order, lease, retry, edge, conc]
      named_tests:
        order_prio: [test_order_priority_first_then_fifo, test_order_priority_beats_available_time]
        expiry: [test_lease_expiry_boundary_and_reappearance, test_lease_ack_after_expiry_is_rejected]
        backoff: [test_retry_default_backoff_doubles, test_retry_backoff_is_capped_at_60s]
        once: [test_conc_each_job_leased_exactly_once, test_conc_more_workers_than_jobs]
      perf:
        path: /health
        requests: 200
        concurrency: 10
calibration:
  tier: hard
  defect_must_fail: []

items:
  - {id: B3-B01, dim: be, tier: basic, weight: 3, method: auto, edition: base, module: func, desc: 主流程（入队、租约、确认、统计、队列隔离）通过率, metric: api.cat.func, rule: {type: ratio}}
  - {id: B3-B02, dim: be, tier: advanced, weight: 4, method: auto, edition: base, module: order, desc: 取出顺序（优先级、延迟、可取出时刻、创建顺序）通过率, metric: api.cat.order, rule: {type: ratio}}
  - {id: B3-B03, dim: be, tier: excellent, weight: 5, method: auto, edition: base, module: lease, desc: 租约语义（过期边界、旧令牌、续租、尝试耗尽进死信）通过率, metric: api.cat.lease, rule: {type: ratio}}
  - {id: B3-B04, dim: be, tier: advanced, weight: 4, method: auto, edition: base, module: retry, desc: 重试语义（指数退避与封顶、自定义延迟、死信顺序、重新入队）通过率, metric: api.cat.retry, rule: {type: ratio}}
  - {id: B3-B05, dim: be, tier: advanced, weight: 3, method: auto, edition: base, module: validation, desc: 输入校验与时间头处理通过率, metric: api.cat.edge, rule: {type: ratio}}
  - {id: B3-B06, dim: be, tier: excellent, weight: 4, method: auto, edition: base, module: concurrency, desc: 并发通过率（每个作业只被取出一次、重复确认只有一次成功）, metric: api.cat.conc, rule: {type: ratio}}
  - {id: B3-B07, dim: be, tier: excellent, weight: 6, method: auto, edition: base, module: chaos, desc: 负载下 kill -9 后重启：作业不丢、已确认不回退、未确认的过期后能重新取出（至少一次投递）, metric: api.chaos_ok, rule: {type: bool}}
  - {id: B3-B08, dim: be, tier: advanced, weight: 2, method: auto, edition: detail, module: backoff, desc: 默认指数退避 1s×2^(n-1)，封顶 60s, metric: api.test.backoff, rule: {type: bool}}
  - id: B3-S01
    dim: be
    tier: advanced
    method: agent
    edition: detail
    module: design
    desc: 状态机设计：作业状态的转换集中在一处，“取出”这个读-改-写是原子的，过期租约的处理方式（惰性 / 定时）在文档里说清楚
    anchors: ["状态散落各处，取出不原子", "大体集中但有并发隐患", "状态转换集中，取出原子", "状态机清晰，原子性与过期处理都有说明并有测试"]
  - id: B3-S02
    dim: be
    tier: advanced
    method: agent
    edition: detail
    module: decisions
    desc: DECISIONS.md 识别了规格灰色地带（如：过期后用旧令牌确认的返回、重新入队后的旧令牌、续租的前置条件）并说明处理
    anchors: ["没有或只复述规格", "识别 1 处", "识别 2 处以上且与实现一致", "识别全面并用测试固定"]
