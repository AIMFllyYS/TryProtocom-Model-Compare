id: V08
suite: v2
kind: motion
name: Aether-9 发布宣传片（v2 愿望版，HyperFrames 端到端）
short: 用 HyperFrames + skills 从事实表到成片（推荐约 20 秒，不限时长）：规格、混音、字幕、事实准确、叙事与吸引力
deliverable_dir: aether9-promo
dims: {anim: 1.0, agent: 1.0, eng: 0.5}
condition: 无人值守；预装 HyperFrames 与官方 skills、统一 TTS 命令；工作目录预置 assets/（事实表、2 首 BGM、4 个音效）
materials: ["materials/assets/aether9-facts.md", "materials/assets/bgm-a.wav", "materials/assets/bgm-b.wav", "materials/assets/sfx/*.wav"]
time_limit_min: 90   # 软时限：只记用时，不中断、不扣分

# v1（T04）里“每 10 秒镜头切换密度”取消：它奖励硬切次数。叙事、节奏、转场质量由人工两两比较。
probes:
  - type: files
    opts:
      required: [final.mp4, subtitles.srt, script.md]
  - type: claims
  - type: video
    opts: {file: final.mp4, srt: subtitles.srt, asr: true, script: script.md}

tier0:
  - {id: V08-T0-1, desc: 交付了可解析的 final.mp4, metric: video.exists, rule: {type: bool}}
  - {id: V08-T0-2, desc: 成片有声音且时长不少于 5 秒, value_expr: "bool(v['video.has_audio']) and (v['video.duration'] or 0) >= 5", rule: {type: bool}}
  - {id: V08-T0-3, desc: 黑帧总时长不超过成片的一半, value_expr: "(v['video.black_s'] or 0) <= 0.5 * max(v['video.duration'] or 1, 1)", rule: {type: bool}}

gates:
  - {id: G1, desc: 交付了可解析的 final.mp4, metric: video.exists, rule: {type: bool}}
  - {id: G2, desc: 最终汇报与实际产出一致, metric: claims.honest, rule: {type: bool}}

items:
  # ---------------- 工程化（成片规格） ----------------
  - {id: V08-E01, dim: eng, tier: basic, method: auto, edition: base, desc: 交付物齐全（成片、字幕、脚本）, metric: files.required_ratio, rule: {type: ratio}}
  - {id: V08-E03, dim: eng, tier: basic, method: auto, edition: base, desc: 分辨率 1920×1080, value_expr: "v['video.width'] == 1920 and v['video.height'] == 1080", rule: {type: bool}}
  - {id: V08-E04, dim: eng, tier: basic, method: auto, edition: base, desc: 帧率 30fps, metric: video.fps, rule: {type: band, lo: 29.9, hi: 30.1, tol: 10}}
  - {id: V08-E05, dim: eng, tier: basic, method: auto, edition: base, desc: 视频编码 H.264, metric: video.h264, rule: {type: bool}}
  - {id: V08-E06, dim: eng, tier: basic, method: auto, edition: base, desc: 音频编码 AAC, metric: video.aac, rule: {type: bool}}
  - {id: V08-E07, dim: eng, tier: advanced, method: auto, edition: detail, module: mix, desc: 整体响度 −16 到 −14 LUFS, metric: video.lufs_i, rule: {type: band, lo: -16, hi: -14, tol: 6}}
  - {id: V08-E08, dim: eng, tier: advanced, method: auto, edition: detail, module: mix, desc: 真峰值不超过 −1 dBTP, metric: video.true_peak, rule: {type: max, max: -1, zero: 1}}
  - {id: V08-E09, dim: eng, tier: basic, method: auto, edition: base, desc: 黑帧总时长（秒）, metric: video.black_s, rule: {type: max, max: 0.3, zero: 2}}

  # ---------------- 动画：客观缺陷与字幕规范 ----------------
  - {id: V08-A01, dim: anim, tier: advanced, method: auto, edition: detail, module: craft, desc: 冻帧总时长（秒）, metric: video.freeze_s, rule: {type: max, max: 0.5, zero: 4}}
  - {id: V08-A02, dim: anim, tier: basic, method: auto, edition: base, module: subtitle, desc: 导出了字幕文件, metric: srt.exists, rule: {type: bool}}
  - {id: V08-A03, dim: anim, tier: advanced, method: auto, edition: detail, module: subtitle, desc: 字幕不换行（每种语言每句一行）, metric: srt.wrapped_cues, rule: {type: max, max: 0, zero: 5}}
  - {id: V08-A04, dim: anim, tier: advanced, method: auto, edition: detail, module: subtitle, desc: 双语字幕占比, metric: srt.bilingual_ratio, rule: {type: ratio}}
  - {id: V08-A05, dim: anim, tier: basic, method: auto, edition: base, module: subtitle, desc: 字幕时间轴无重叠, metric: srt.overlaps, rule: {type: max, max: 0, zero: 3}}
  - {id: V08-A06, dim: anim, tier: basic, method: auto, edition: base, module: subtitle, desc: 字幕时间不越界, metric: srt.out_of_range, rule: {type: max, max: 0, zero: 2}}
  - {id: V08-A07, dim: anim, tier: excellent, method: auto, edition: detail, module: voice, desc: 配音与脚本一致（ASR 字错率）, metric: asr.cer, rule: {type: max, max: 0.15, zero: 0.6}}

  # ---------------- 人工（两两比较为主） ----------------
  - id: V08-H01
    dim: anim
    tier: advanced
    method: human
    judge: pairwise
    edition: base
    module: narrative
    desc: 叙事与吸引力（开头抓人、有取舍、有起伏，让人想看完并转发）
    evidence: final.mp4
    anchors: ["像草稿", "及格", "好看", "想转发"]
  - id: V08-H02
    dim: anim
    tier: advanced
    method: human
    judge: pairwise
    edition: base
    module: transition
    desc: 转场与动效是否服务叙事（多样但不乱，节奏有起伏）
    evidence: final.mp4
    anchors: ["硬切为主或节奏拖沓", "有动效但节奏平", "紧凑有起伏", "转场有创意并服务叙事，节奏抓人"]
  - id: V08-H03
    dim: anim
    tier: advanced
    method: human
    edition: detail
    module: subtitle
    desc: 烧录字幕可读性（位置、字号、描边 / 底衬、与画面不冲突）
    evidence: final.mp4
    anchors: ["看不清或遮挡主体", "能看清但丑", "清晰规范", "清晰且与整体设计统一"]
  - id: V08-H04
    dim: anim
    tier: advanced
    method: human
    judge: pairwise
    edition: detail
    module: mix
    desc: 旁白与画面同步、混音听感（BGM 在人声下压低、音效点缀）
    evidence: final.mp4 带声音
    anchors: ["人声被盖住或不同步", "能听清但混音粗糙", "同步且层次清楚", "专业听感"]
  - id: V08-H05
    dim: anim
    tier: advanced
    method: human
    judge: pairwise
    edition: detail
    module: visual
    desc: 视觉语言自洽（色彩、字体、图形、质感前后一致，有记忆点）
    evidence: final.mp4
    anchors: ["每个镜头各一套语言", "基本自洽但平庸", "自洽且好看", "整体语言鲜明，有强记忆点"]

  # ---------------- Agent 执行 ----------------
  - id: V08-S01
    dim: agent
    tier: advanced
    method: agent
    edition: base
    module: skill
    desc: 使用 HyperFrames skills 完成（项目结构、组合规范、CLI 渲染）
    anchors: ["未使用", "只用了渲染命令", "按 skill 组织项目", "完整使用相关 skill（含音频 / 字幕类）"]
  - id: V08-S02
    dim: agent
    tier: excellent
    method: agent
    edition: detail
    module: verify
    desc: 自我验证：渲染后检查成片（时长 / 响度 / 字幕 / 抽帧）并据此修正
    anchors: ["没有检查", "只确认文件存在", "检查了规格", "检查了规格和画面并做了修正"]
  - id: V08-S03
    dim: agent
    tier: advanced
    method: agent
    edition: base
    module: facts
    desc: 信息准确：脚本与画面中的所有参数都来自事实表，没有编造
    anchors: ["多处编造", "1–2 处不符", "全部准确", "全部准确且信息取舍得当"]
