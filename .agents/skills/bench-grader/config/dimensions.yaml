# 雷达图维度定义。quality 维度参与质量总分；efficiency 维度单独换算。
# weight 是质量总分中的权重，可按你的实际用途调整（调整后需在报告中注明）。
dimensions:
  - id: 3d
    name: 3D
    kind: quality
    weight: 1.0
    desc: 程序化建模、材质与光照、3D 运动与相机、3D 交互与性能、领域准确性（物理/生物/工程比例）
  - id: anim
    name: 动画动效
    kind: quality
    weight: 1.0
    desc: 缓动与节奏、编排层次、转场、文字动效、音画配合、定格节奏
  - id: ui
    name: 前端 UI/UX
    kind: quality
    weight: 1.0
    desc: 视觉设计、信息层级、交互流程、状态处理（空/加载/错误）、响应式、无障碍
  - id: be
    name: 后端
    kind: quality
    weight: 1.0
    desc: API 实现与规格一致、数据建模、鉴权与安全、并发与健壮性、性能
  - id: eng
    name: 工程化
    kind: quality
    weight: 1.0
    desc: 构建与打包、类型安全、依赖控制、可复现、代码完整性、调试修复、测试
  - id: req
    name: 需求理解
    kind: quality
    weight: 1.0
    desc: 识别歧义与矛盾、该问才问、写明假设、最终结果贴合真实意图
  - id: agent
    name: Agent 执行
    kind: quality
    weight: 1.0
    desc: skill 遵循、自我验证（运行/截图/测试）、出错后修复、汇报与实际一致
  - id: stability
    name: 稳定性
    kind: quality
    weight: 0
    only_views: [full]
    desc: 仅 v2 完整版（每题测满 3 次）出现。= 50% 可用率（Tier0 通过的运行占比）+ 50% 一致性（100 − 2 × 各题运行分标准差的均值）；失误计入，不剔除。不进质量总分。
  - id: cost
    name: 成本效率
    kind: efficiency
    desc: 每题平均费用相对该题各参赛者中位数的倍数，按题几何加权并向基线收缩；持平 50 分，便宜 4 倍 100 分，贵 4 倍 0 分。没有记录的费用不计（未记录）
  - id: speed
    name: 速度
    kind: efficiency
    desc: 每题平均用时相对该题各参赛者中位数的倍数，按题几何加权并向基线收缩；持平 50 分，快 4 倍 100 分，慢 4 倍 0 分。超过 5 小时的运行需核实，核实排除的不计入
